include "frontend.conf"

appName="council-tax-ufs-frontend"

play.http.router = prod.Routes

play.http.errorHandler = "handlers.ErrorHandler"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "config.Module"

play.filters.enabled += play.filters.csp.CSPFilter

play.i18n.langs = ["en", "cy"]

microservice {
    services {
      auth {
        protocol = http
        host     = localhost
        port     = 8500
      }

      feedback-frontend {
        protocol = http
        host     = localhost
        port     = 9514
      }

      centralised-authorisation-server {
        host = localhost
        port = 15000
      }

      resource-client-store {
      host = localhost
      port = 15011
      }

      bridge-integration {
      protocol = http
      host = localhost
      port = 1300
     }

      bridge-integration-stub {
      protocol = http
      host     = localhost
      port     = 1303
     }

      upscan-initiate {
      protocol = http
      host     = localhost
      port     = 9570      
     }
     
      object-store {
      protocol = http
      host     = localhost
      port = 8464
     }

    }
}

contact-frontend {
  host      = "http://localhost:9250"
  serviceId = "council-tax-ufs-frontend"
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

session {
  timeoutSeconds = 900
}

mongodb {
  uri                 = "mongodb://localhost:27017/"${appName}
  timeToLiveInSeconds = 900
}

urls {
  login         = "http://localhost:9949/auth-login-stub/gg-sign-in"
  loginContinue = "http://localhost:60002/council-tax-ufs"
  signOut       = "http://localhost:9553/bas-gateway/sign-out-without-state"
}

host = "http://localhost:60002"

accessibility-statement{
  service-path = "/council-tax-ufs"
}

tracking-consent-frontend {
  gtm.container = "transitional"
}

play-frontend-hmrc {
    useRebrand = false
}


features {
  welsh-translation: true
}
