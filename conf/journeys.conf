# The journeys a request can be submitted as, and the codes each one carries.
#
# A journey is chosen by its "selectors": the answers the user gave, by page name, and the value(s) each must have.
# It then sends its premise plus its "questions". The premise and the codes of what is built must identify the
# same journey again, or nothing is sent (see services.submission.JourneyRegistry).
#
# question fields
#   code      JSIP code: S = statement, I = information, P = proposition (a premise is J..)
#   question  messages key of the question text (sent in English)
#   page      the page whose answer is sent
#   type      text | date | choice   (choice is sent as the label of the option picked, messages key "<prefix>.<value>")
#   prefix    choice only, defaults to the page name
#   required  default true; false means it is sent only if answered
#   when      default always; the question is only asked if these answers match (page = value or [values])
#
# Journey 4 has four shapes that share premise J04, so it is listed four times (4.1 to 4.4).
# Journeys 5/6/7/8 and 9/10 carry the same codes, so only their premise (and selectors) tell them apart.
# To add a journey, add an entry to "list"; no code changes.

journeys {

  parts {
    whyBandIsWrong  { code = S01, question = whyBandIsWrong.heading, page = whyBandIsWrong, type = text }
    whichBand       { code = P01, question = whichBand.heading, page = whichBand, type = choice }
    addressChanged  { code = I11, question = addressChanged.heading, page = addressChanged, type = text }
    uninhabitable   { code = S02, question = propertyUninhabitable.heading, page = propertyUninhabitable, type = choice }
    uninhabitableWhy { code = S01, question = uninhabitableDetails.heading, page = uninhabitableDetails, type = choice }
  }

  list = [
    {
      key = J01
      number = 1
      name = Ufs_CTPayer_LessThanSixMonths
      selectors { reasonForReview = "band-is-wrong", scenarioResponsible = "less-than" }
      premise { code = J01, question = scenarioResponsible.heading, page = scenarioResponsible, type = choice }
      questions = [
        { code = P02, question = councilTaxLiabilityStartDate.heading, page = councilTaxLiabilityStartDate, type = date }
        ${journeys.parts.whyBandIsWrong}
        ${journeys.parts.whichBand}
      ]
    }
    {
      key = J02
      number = 2
      name = Ufs_CTPayer_GreaterThanSixMonths_NotReceivedNoa
      selectors { reasonForReview = "band-is-wrong", scenarioResponsible = "more-than", noticeAlteration = "no" }
      premise { code = J02, question = noticeAlteration.heading, page = noticeAlteration, type = choice }
      questions = [
        ${journeys.parts.whyBandIsWrong}
        ${journeys.parts.whichBand}
      ]
    }
    {
      key = J03
      number = 3
      name = Ufs_CTPayer_GreaterThanSixMonths_ReceivedNoa
      selectors { reasonForReview = "band-is-wrong", scenarioResponsible = "more-than", noticeAlteration = "yes" }
      premise { code = J03, question = noticeAlteration.heading, page = noticeAlteration, type = choice }
      questions = [
        { code = I04, question = dateNotice.heading, page = dateNotice, type = date }
        ${journeys.parts.whyBandIsWrong}
        ${journeys.parts.whichBand}
      ]
    }
    {
      key = J04.1
      number = 4
      name = Ufs_Deletion
      selectors { reasonForReview = "changes-affected-property", deletionOptions = demolished, propertyUninhabitable = demolished }
      premise { code = J04, question = deletionOptions.heading, page = deletionOptions, type = choice }
      questions = [
        ${journeys.parts.uninhabitable}
        ${journeys.parts.uninhabitableWhy}
        { code = P02, question = demolishedDate.heading, page = demolishedDate, type = date }
        { code = I10, question = demolishedDetails.heading, page = demolishedDetails, type = text }
      ]
    }
    {
      key = J04.2
      number = 4
      name = Ufs_Deletion
      selectors { reasonForReview = "changes-affected-property", deletionOptions = demolished, propertyUninhabitable = derelict }
      premise { code = J04, question = deletionOptions.heading, page = deletionOptions, type = choice }
      questions = [
        ${journeys.parts.uninhabitable}
        ${journeys.parts.uninhabitableWhy}
        { code = I06, question = uninhabitableDate.heading, page = uninhabitableDate, type = date }
        { code = I01, question = uninhabitableDateLastOccupied.heading, page = uninhabitableDateLastOccupied, type = date }
        # fire and flood are asked what they plan to do; "other" describes the property instead. Both are I07.
        { code = I07, question = uninhabitableDetailsPlan.heading, page = uninhabitableDetailsPlan, type = text,
          when { uninhabitableDetails = [fireDamage, floodDamage] } }
        { code = I07, question = uninhabitableDetailsOther.heading, page = uninhabitableDetailsOther, type = text,
          when { uninhabitableDetails = other } }
        { code = I08, question = uninhabitableDetailsPlanHabitable.heading, page = uninhabitableDetailsPlanHabitable, type = text,
          required = false, when { uninhabitableDetails = [fireDamage, floodDamage] } }
        { code = I09, question = uninhabitableDetailsPlanPlanningApplication.heading, page = uninhabitableDetailsPlanPlanningApplication, type = text,
          required = false, when { uninhabitableDetails = [fireDamage, floodDamage] } }
      ]
    }
    {
      key = J04.3
      number = 4
      name = Ufs_Deletion
      selectors { reasonForReview = "changes-affected-property", deletionOptions = demolished, propertyUninhabitable = reno }
      premise { code = J04, question = deletionOptions.heading, page = deletionOptions, type = choice }
      questions = [
        ${journeys.parts.uninhabitable}
        { code = P02, question = renoStartDate.heading, page = renoStartDate, type = date }
        { code = I03, question = renoCompletionDate.heading, page = renoCompletionDate, type = date }
        { code = S01, question = renoDetails.heading, page = renoDetails, type = text }
      ]
    }
    {
      key = J04.4
      number = 4
      name = Ufs_Deletion
      selectors { reasonForReview = "changes-affected-property", deletionOptions = demolished, propertyUninhabitable = partdemo }
      premise { code = J04, question = deletionOptions.heading, page = deletionOptions, type = choice }
      questions = [
        ${journeys.parts.uninhabitable}
        { code = S01, question = partDemoDetails.heading, page = partDemoDetails, type = text }
        { code = P02, question = partDemoDate.heading, page = partDemoDate, type = date }
      ]
    }
    {
      key = J05
      number = 5
      name = UFS_MergedWithOneOrMoreProperties
      selectors { reasonForReview = "changes-affected-property", deletionOptions = split, propertySplitOrMerge = merged }
      premise { code = J05, question = propertySplitOrMerge.heading, page = propertySplitOrMerge, type = choice }
      questions = [
        { code = S01, question = propertyMergedDetails.heading, page = propertyChangeDetails, type = text }
        { code = P02, question = propertyMergedDate.heading, page = propertyChangeDate, type = date }
        ${journeys.parts.addressChanged}
      ]
    }
    {
      key = J06
      number = 6
      name = Ufs_SplitIntoMultipleProperties
      selectors { reasonForReview = "changes-affected-property", deletionOptions = split, propertySplitOrMerge = split }
      premise { code = J06, question = propertySplitOrMerge.heading, page = propertySplitOrMerge, type = choice }
      questions = [
        { code = S01, question = propertySplitDetails.heading, page = propertyChangeDetails, type = text }
        { code = P02, question = propertySplitDate.heading, page = propertyChangeDate, type = date }
        ${journeys.parts.addressChanged}
      ]
    }
    {
      key = J07
      number = 7
      name = Ufs_PartOrAllOfTheProperty_IsNowUsedAsAHome
      selectors { reasonForReview = "changes-affected-property", deletionOptions = changed, changeOfUse = domestic }
      premise { code = J07, question = changeOfUse.heading, page = changeOfUse, type = choice }
      questions = [
        { code = S01, question = domesticParts.heading, page = domesticParts, type = text }
        { code = P02, question = domesticDate.heading, page = domesticDate, type = date }
        ${journeys.parts.addressChanged}
      ]
    }
    {
      key = J08
      number = 8
      name = Ufs_PartOrAllOfTheProperty_IsNowUsedAsABusiness
      selectors { reasonForReview = "changes-affected-property", deletionOptions = changed, changeOfUse = business }
      premise { code = J08, question = changeOfUse.heading, page = changeOfUse, type = choice }
      questions = [
        { code = S01, question = businessParts.heading, page = businessParts, type = text }
        { code = P02, question = businessDate.heading, page = businessDate, type = date }
        ${journeys.parts.addressChanged}
      ]
    }
    {
      key = J09
      number = 9
      name = Ufs_ChangesToTheLocalArea_AffectedMyProperty
      selectors { reasonForReview = "changes-affected-property", deletionOptions = affected }
      premise { code = J09, question = deletionOptions.heading, page = deletionOptions, type = choice }
      questions = [
        { code = S01, question = localAreaChanges.heading, page = whatHasChanged, type = text }
        { code = P02, question = localAreaChangesDate.heading, page = whenDidChangeHappen, type = date }
      ]
    }
    {
      key = J10
      number = 10
      name = Ufs_Other_Reasons
      selectors { reasonForReview = "changes-affected-property", deletionOptions = anotherReason }
      premise { code = J10, question = deletionOptions.heading, page = deletionOptions, type = choice }
      questions = [
        { code = S01, question = whatHasChanged.heading, page = whatHasChanged, type = text }
        { code = P02, question = whenDidChangeHappen.heading, page = whenDidChangeHappen, type = date }
      ]
    }
  ]
}
